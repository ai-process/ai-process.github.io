name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Picks up a new install.sh from ai-process/ktms without a site change.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch install.sh from ai-process/ktms
        run: |
          if curl -fsSL https://raw.githubusercontent.com/ai-process/ktms/main/scripts/install.sh -o install.sh.new && head -n 1 install.sh.new | grep -q '^#!/bin/sh'; then
            mv install.sh.new install.sh
          else
            rm -f install.sh.new
            echo "::warning::could not fetch install.sh; serving the committed copy"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
